services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8000"
    volumes:
      - sqlite_data:/app/data
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/prompt_scores.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://brollysolutions.in/prompt_generator/api}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - USE_BASE_PATH=true
    ports:
      - "3006:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
