services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Bind to localhost only; the host nginx proxies to 127.0.0.1:8006.
      - "127.0.0.1:8006:8000"
    volumes:
      - sqlite_data:/app/data
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/prompt_scores.db
      # 2 workers keeps memory well under the limit; the AI libraries (google-genai,
      # groq) are heavy, so 4 workers can exceed a tight memory cap and get OOM-killed.
      - WEB_CONCURRENCY=2
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://brollysolutions.in/prompt_generator/api}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - USE_BASE_PATH=true
    ports:
      - "127.0.0.1:3006:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  sqlite_data:
