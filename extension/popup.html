<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prompt Generator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <div class="brand"><span class="logo">✦</span><span>Prompt Generator</span></div>
      <h1>Enhance any prompt</h1>
      <p>Select text on a webpage, right-click it, and choose <strong>Enhance Prompt</strong>.</p>
      <div class="tip"><span>⌘</span><span>Your enhanced prompt will appear in a floating window on the page.</span></div>
      <div id="status" class="status" role="status">Ready to enhance.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
