services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8000"
    volumes:
      - sqlite_data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - DB_PATH=/app/data/prompt_scores.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3006:3000"
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
