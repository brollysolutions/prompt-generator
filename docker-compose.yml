services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8006:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - DB_PATH=/app/data/prompt_scores.db
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_dev_only}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3006:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8006/prompt_generator/api
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
