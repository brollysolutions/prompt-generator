upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Increase timeouts for long-running AI requests
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Allow larger request bodies (long prompts)
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain text/javascript image/svg+xml;

    # Rate limiting for the API (defined in the http{} block of the parent config;
    # see note below). Uncomment the limit_req line once the zone is declared.
    # limit_req zone=api_limit burst=20 nodelay;

    # --- Backend API ---
    # Route /prompt_generator/api/ requests to the FastAPI backend.
    # CORS is owned by the FastAPI app (credentialed, explicit allow-list). Do NOT
    # add CORS headers here — a wildcard origin plus credentials is invalid and would
    # duplicate the backend headers.
    location /prompt_generator/api/ {
        proxy_pass http://backend/prompt_generator/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- Frontend (Next.js) ---
    # Route /prompt_generator/ requests to the Next.js frontend
    location /prompt_generator/ {
        proxy_pass http://frontend/prompt_generator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Required for Google Login popup - allow cross-origin popups
        proxy_hide_header Cross-Origin-Opener-Policy;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # --- Next.js internals ---
    # Route /_next/ static assets and HMR websockets
    location /_next/ {
        proxy_pass http://frontend/_next/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for HMR (dev only, harmless in prod)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Root redirect ---
    location = / {
        return 301 /prompt_generator/;
    }
}
