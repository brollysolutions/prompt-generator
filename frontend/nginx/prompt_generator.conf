# =============================================
# PROMPT GENERATOR - Nginx Config Snippet
# =============================================
# Replace the existing /prompt_generator blocks in
# /etc/nginx/sites-available/rag_chatbot with these:
#
# Then run:  sudo nginx -t && sudo systemctl reload nginx
# =============================================

# Backend API - with proper headers and timeout for AI requests
location /prompt_generator/api/ {
    proxy_pass http://127.0.0.1:8006/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Timeout for long-running AI/LLM requests
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Allow larger request bodies
    client_max_body_size 10M;
}

# Frontend (Next.js)
location /prompt_generator/ {
    proxy_pass http://127.0.0.1:3006/prompt_generator/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
